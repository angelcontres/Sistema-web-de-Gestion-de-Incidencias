version: '3.8'

services:
  # Servidor Web (Nginx) - Despacha Frontend y redirige API
  nginx:
    image: nginx:alpine
    container_name: sistema_nginx
    ports:
      - "80:80"
    volumes:
      # Mapea todo el proyecto para que Nginx acceda a frontend/ y backend/
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
      - postgres
    networks:
      - sistema_net

  # El Backend (Laravel API)
  laravel:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: sistema_laravel
    user: "1000:1000"
    volumes:
      - ./backend/api:/var/www/html
    networks:
      - sistema_net

  # Base de Datos (PostgreSQL) [Asignatura: Base de Datos / Data Center]
  postgres:
    image: postgres:15-alpine
    container_name: sistema_postgres
    restart: always
    environment:
      POSTGRES_DB: gestion_incidencias
      POSTGRES_USER: angeltux
      POSTGRES_PASSWORD: password_segura_upse
    ports:
      - "5432:5432"
    volumes:
      # Persistencia obligatoria para asegurar los puntos de Data Center
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sistema_net

  # El túnel gratuito de Cloudflare
  tunnel:
      image: cloudflare/cloudflared:latest
      container_name: sistema_tunnel
      restart: always
      command: tunnel --no-autoupdate run --token eyJhIjoiY2NmNGI3MzM0MGRhYWQ4NGMzZTU0ZjgyMjFhY2MxNDEiLCJ0IjoiMWViOTVlZmEtMzlkMy00NDA3LTljYjYtY2VlYTBlZmFjMzRkIiwicyI6Ik1HVmxPV0V3WkRjdE16bGtNUzAwWlRrMUxXRmpOakF0WkdRek16VmtZMlkwWW1FeSJ9
      depends_on:
        - nginx
      networks:
        - sistema_net
networks:
  sistema_net:
    driver: bridge

volumes:
  postgres_data:
