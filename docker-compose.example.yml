version: "3.8"

services:
  # Servidor Web (Nginx) - Despacha Frontend y redirige API
  nginx:
    image: nginx:alpine
    container_name: sistema_nginx_example
    restart: always
    ports:
      - "3005:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
      - postgres
    networks:
      - sistema_incidencias_net_example

  # El Backend (Laravel API)
  laravel:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: sistema_laravel_example
    restart: always
    volumes:
      - ./backend/api:/var/www/html
    networks:
      - sistema_incidencias_net_example

  # Worker de Laravel para procesar tareas en segundo plano (Colas)
  laravel-worker:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: sistema_laravel_worker_example
    restart: always
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - ./backend/api:/var/www/html
    depends_on:
      - postgres
      - laravel
    networks:
      - sistema_incidencias_net_example

  # Scheduler de Laravel para ejecutar tareas programadas (ETL y comandos SQA)
  laravel-scheduler:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: sistema_laravel_scheduler_example
    restart: always
    command: php artisan schedule:work
    volumes:
      - ./backend/api:/var/www/html
    depends_on:
      - postgres
      - laravel
    networks:
      - sistema_incidencias_net_example

  # Servidor de WebSockets (Reverb)
  laravel-reverb:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: sistema_reverb_example
    restart: always
    command: php artisan reverb:start --host="0.0.0.0" --port=8080
    volumes:
      - ./backend/api:/var/www/html
    depends_on:
      - postgres
      - laravel
    networks:
      - sistema_incidencias_net_example

   # Base de Datos (PostgreSQL + PostGIS)
  postgres:
    image: postgis/postgis:17-3.4-alpine
    container_name: sistema_postgres_example
    restart: always
    environment:
      POSTGRES_DB: gestion_incidencias
      POSTGRES_USER: angeltux
      POSTGRES_PASSWORD: ${DB_PASSWORD:-YOUR_DB_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - postgres_data_example:/var/lib/postgresql/data
    networks:
      - sistema_incidencias_net_example

  # El túnel de Cloudflare
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sistema_tunnel_example
    restart: always
    volumes:
      - ./cloudflare:/etc/cloudflared
    command: tunnel run YOUR_CLOUDFLARE_TUNNEL_TOKEN
    depends_on:
      - nginx
    networks:
      - sistema_incidencias_net_example

  # Grafana para visualización y analítica
  grafana:
    image: grafana/grafana:latest
    container_name: sistema_grafana_example
    restart: always
    ports:
      - "3010:3000"
    volumes:
      - grafana_data_example:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-YOUR_GRAFANA_PASSWORD}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - postgres
    networks:
      - sistema_incidencias_net_example

  # Base de datos dedicada para SonarQube
  sonarqube_db:
    image: postgres:15-alpine
    container_name: sistema_sonarqube_db_example
    restart: always
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-YOUR_SONAR_DB_PASSWORD}
    volumes:
      - sonarqube_db_data_example:/var/lib/postgresql/data
    networks:
      - sistema_incidencias_net_example

  # Inicializador de permisos de SonarQube
  sonarqube_init:
    image: busybox
    container_name: sistema_sonarqube_init_example
    command: chown -R 1000:1000 /opt/sonarqube/data /opt/sonarqube/extensions /opt/sonarqube/logs
    volumes:
      - sonarqube_data_example:/opt/sonarqube/data
      - sonarqube_extensions_example:/opt/sonarqube/extensions
      - sonarqube_logs_example:/opt/sonarqube/logs
    networks:
      - sistema_incidencias_net_example

  # Servidor SonarQube (Calidad de Código / SQA)
  sonarqube:
    image: sonarqube:lts-community
    container_name: sistema_sonarqube_example
    restart: always
    ports:
      - "9009:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sistema_sonarqube_db_example:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD:-YOUR_SONAR_DB_PASSWORD}
    volumes:
      - sonarqube_data_example:/opt/sonarqube/data
      - sonarqube_extensions_example:/opt/sonarqube/extensions
      - sonarqube_logs_example:/opt/sonarqube/logs
    depends_on:
      - sonarqube_db
      - sonarqube_init
    networks:
      - sistema_incidencias_net_example

networks:
  sistema_incidencias_net_example:
    name: sistema_incidencias_net_example
    driver: bridge

volumes:
  postgres_data_example:
  grafana_data_example:
  sonarqube_db_data_example:
  sonarqube_data_example:
  sonarqube_extensions_example:
  sonarqube_logs_example:
