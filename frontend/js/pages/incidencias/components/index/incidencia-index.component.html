<div class="page-fade-in">
  <!-- Cabecera de Página -->
  <div
    class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4"
  >
    <div>
      <h1 class="h3 fw-bold text-dark mb-1">Módulo de Gestión de Incidencias</h1>
      <p class="text-muted small mb-0">
        Registra, clasifica, geolocaliza y supervisa las incidencias y alertas del sistema.
      </p>
    </div>
    <!-- Enlace para ir al formulario en modo creación -->
    <a
      id="btn-nuevo-registro"
      href="#/incidencias/form"
      class="btn btn-primary fw-semibold px-4 py-2 rounded-2 d-flex align-items-center gap-2"
    >
      <i class="bi bi-plus-circle"></i> Nueva Incidencia
    </a>
  </div>

  <!-- Alertas de éxito y error -->
  <div id="successAlert" class="alert alert-success d-none mb-3" role="alert">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-check-circle-fill"></i>
      <span id="successMessage"></span>
    </div>
  </div>

  <div id="errorAlert" class="alert alert-danger d-none mb-3" role="alert">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span id="errorMessage"></span>
    </div>
  </div>

  <!-- Tabla Auto-Contenida (Maneja tarjeta, loading, vacío y errores internamente) -->
  <app-data-table id="tbl-datos-incidencias" title="Lista de Incidencias" empty-text="No se encontraron incidencias registradas."></app-data-table>
</div>
