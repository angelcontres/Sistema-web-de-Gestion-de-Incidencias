<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="h3 mb-0 text-gray-800 fw-bold">
    <i class="bi bi-kanban text-primary me-2"></i>Tablero de Trabajo
  </h2>
  <button class="btn btn-outline-secondary" id="btn-refresh">
    <i class="bi bi-arrow-clockwise"></i> Actualizar
  </button>
</div>

<div id="successAlert" class="alert alert-success d-none mb-4 shadow-sm" role="alert">
  <i class="bi bi-check-circle-fill me-2"></i><span id="successMessage"></span>
</div>
<div id="errorAlert" class="alert alert-danger d-none mb-4 shadow-sm" role="alert">
  <i class="bi bi-exclamation-triangle-fill me-2"></i><span id="errorMessage"></span>
</div>

<div class="row g-4" id="kanban-board">
  <!-- Columna En Proceso (Estado 4) -->
  <div class="col-md-6">
    <div class="card h-100 border-0 shadow-sm rounded-4" style="background-color: #f8f9fa">
      <div
        class="card-header bg-warning bg-opacity-25 text-dark rounded-top-4 border-0 py-3 d-flex justify-content-between align-items-center"
      >
        <h5 class="mb-0 fw-bold"><i class="bi bi-gear-fill me-2 text-warning"></i>En Proceso</h5>
        <span class="badge bg-warning text-dark rounded-pill" id="count-proceso">0</span>
      </div>
      <div
        class="card-body p-3 d-flex flex-column gap-3"
        id="col-en-proceso"
        style="min-height: 400px"
      >
        <div class="text-center text-muted mt-5 spinner-col">
          <output class="spinner-border text-warning"></output>
        </div>
      </div>
    </div>
  </div>

  <!-- Columna Resuelto (Estado 5) -->
  <div class="col-md-6">
    <div class="card h-100 border-0 shadow-sm rounded-4" style="background-color: #f8f9fa">
      <div
        class="card-header bg-success bg-opacity-25 text-dark rounded-top-4 border-0 py-3 d-flex justify-content-between align-items-center"
      >
        <h5 class="mb-0 fw-bold">
          <i class="bi bi-check-circle-fill me-2 text-success"></i>Resueltas
        </h5>
        <span class="badge bg-success rounded-pill" id="count-resuelto">0</span>
      </div>
      <div
        class="card-body p-3 d-flex flex-column gap-3"
        id="col-resuelto"
        style="min-height: 400px"
      >
        <div class="text-center text-muted mt-5 spinner-col">
          <output class="spinner-border text-success"></output>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal para adjuntar evidencias y resolver -->
<div
  class="modal fade"
  id="modalResolver"
  tabindex="-1"
  aria-labelledby="modalResolverLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header bg-light border-0 rounded-top-4">
        <h5 class="modal-title fw-bold" id="modalResolverLabel">Resolver Incidencia</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="form-resolver">
          <input type="hidden" id="resolver-incidencia-id" />
          <input type="hidden" id="resolver-incidencia-version" />
          <div class="mb-3">
            <label for="resolver-comentario" class="form-label fw-semibold"
              >Comentario de Resolución</label
            >
            <textarea
              class="form-control"
              id="resolver-comentario"
              rows="3"
              placeholder="Detalla cómo se resolvió la incidencia..."
              required
              maxlength="200"
            ></textarea>
            <div class="form-text text-end"><span id="char-count">0</span>/200</div>
          </div>
          <!-- Adjuntar evidencias -->
          <div class="mb-3">
            <label for="fileInputKanban" class="form-label fw-semibold"
              >Evidencias (Obligatorio)</label
            >
            <div
              id="dropzoneContainerKanban"
              class="border rounded-3 p-4 text-center cursor-pointer mb-2"
              style="border-style: dashed !important; background-color: #f8f9fa"
            >
              <i class="bi bi-cloud-arrow-up display-6 text-primary mb-2"></i>
              <p class="mb-0 text-dark fw-medium">
                Arrastra tus imágenes aquí o haz clic para seleccionar
              </p>
              <span class="text-muted small mt-1"
                >Máx. 10 MB por archivo. (Se comprimirán a WebP)</span
              >
              <input type="file" id="fileInputKanban" class="d-none" accept="image/*" multiple />
            </div>
            <!-- Contenedor para previsualizaciones -->
            <div
              id="thumbnailsContainerKanban"
              class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-2 mt-3"
            ></div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button type="button" class="btn btn-success rounded-pill px-4" id="btn-confirmar-resolver">
          <i class="bi bi-check2-circle me-1"></i> Marcar Resuelta
        </button>
      </div>
    </div>
  </div>
</div>
