<div class="card custom-card border-0 shadow-sm overflow-hidden">
  <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
    <h5 class="card-title fw-bold mb-0 text-dark">Catálogo de Países</h5>
    <button id="btnNuevoPais" class="btn btn-sm btn-primary fw-semibold px-3 py-2 rounded-2 d-flex align-items-center gap-2">
      <i class="bi bi-plus-lg"></i> Nuevo País
    </button>
  </div>
  
  <div class="card-body p-0">
    <!-- Alertas locales del componente -->
    <div id="paisesErrorAlert" class="alert alert-danger mx-4 my-2 d-none">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span id="paisesErrorMessage">Error en la operación.</span>
    </div>
    <div id="paisesSuccessAlert" class="alert alert-success mx-4 my-2 d-none">
      <i class="bi bi-check-circle-fill me-2"></i>
      <span id="paisesSuccessMessage">Operación realizada con éxito.</span>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light text-muted small uppercase">
          <tr>
            <th class="ps-4">Nombre</th>
            <th>Código ISO</th>
            <th>Estado</th>
            <th class="text-end pe-4">Acciones</th>
          </tr>
        </thead>
        <tbody id="paisesTableBody">
          <!-- Se inyecta dinámicamente -->
        </tbody>
      </table>
    </div>
    <div id="paisesEmptyState" class="text-center py-5 d-none">
      <i class="bi bi-globe2 text-muted display-4"></i>
      <p class="text-muted mt-2">No hay países registrados.</p>
    </div>
  </div>
</div>

<!-- MODAL PAÍS -->
<div class="modal fade" id="paisModal" tabindex="-1" aria-labelledby="paisModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-white border-0 pt-4 px-4 pb-2">
        <h5 class="modal-title fw-bold text-dark" id="paisModalLabel">Nuevo País</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body px-4 pb-4">
        <div id="paisModalErrorAlert" class="alert alert-danger d-none py-2 px-3 small mb-3">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <span id="paisModalErrorMessage">Error.</span>
        </div>
        <form id="paisForm" novalidate>
          <input type="hidden" id="paisId" />
          <div class="mb-3">
            <label for="paisNombre" class="form-label fw-semibold text-dark">Nombre del País</label>
            <input type="text" class="form-control" id="paisNombre" required placeholder="Ej: Perú, México" />
            <div class="invalid-feedback">El nombre es obligatorio.</div>
          </div>
          <div class="mb-3">
            <label for="paisCodigo" class="form-label fw-semibold text-dark">Código ISO (2 o 3 letras)</label>
            <input type="text" class="form-control" id="paisCodigo" required placeholder="Ej: PE, MX" maxlength="5" />
            <div class="invalid-feedback">El código ISO es obligatorio.</div>
          </div>
          <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" role="switch" id="paisActivo" checked />
            <label class="form-check-label fw-semibold text-dark" for="paisActivo">País Activo</label>
          </div>
          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-light fw-semibold" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary fw-semibold px-4" id="btnPaisSubmit">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
