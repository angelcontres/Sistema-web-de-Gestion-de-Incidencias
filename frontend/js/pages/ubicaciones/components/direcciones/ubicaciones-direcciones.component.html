<div class="row g-3">
  <!-- Columna de la Tabla -->
  <div class="col-lg-7">
    <div class="card custom-card border-0 shadow-sm overflow-hidden h-100">
      <div class="card-header bg-white border-0 py-3 d-flex flex-column flex-xxl-row justify-content-between align-items-xxl-center gap-3">
        <h5 class="card-title fw-bold mb-0 text-dark">Direcciones Registradas</h5>
        <div class="d-flex flex-wrap gap-2">
          <!-- Filtro por País -->
          <select id="filterPaisSelect" class="form-select form-select-sm" style="width: 140px;">
            <option value="">Todos los Países</option>
            <!-- Se inyecta dinámicamente -->
          </select>
          
          <!-- Filtro por Estado de Dirección -->
          <select id="filterEstadoSelect" class="form-select form-select-sm" style="width: 120px;">
            <option value="">Todos los Estados</option>
            <option value="activo">Activas</option>
            <option value="inactivo">Inactivas</option>
          </select>

          <input type="text" id="direccionSearch" class="form-control form-control-sm" placeholder="Buscar..." style="width: 140px;" />
          <button id="btnNuevaDireccion" class="btn btn-sm btn-primary fw-semibold px-2 py-1.5 rounded-2 d-flex align-items-center gap-1.5">
            <i class="bi bi-plus-lg"></i> Nueva
          </button>
        </div>
      </div>
      
      <div class="card-body p-0">
        <div class="table-responsive" style="max-height: 450px;">
          <table class="table table-hover align-middle mb-0 table-sm text-nowrap">
            <thead class="table-light text-muted small uppercase">
              <tr>
                <th class="ps-3">País</th>
                <th>Ubicación</th>
                <th>Dirección / Detalle</th>
                <th>Cód. Postal</th>
                <th>Estado</th>
                <th class="text-end pe-3">Acciones</th>
              </tr>
            </thead>
            <tbody id="direccionesTableBody">
              <!-- Se llena dinámicamente -->
            </tbody>
          </table>
        </div>
        <div id="direccionesEmptyState" class="text-center py-5 d-none">
          <i class="bi bi-geo-alt text-muted display-4"></i>
          <p class="text-muted mt-2">No hay direcciones registradas.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Columna del Mapa -->
  <div class="col-lg-5">
    <div class="card custom-card border shadow-sm h-100 overflow-hidden bg-white">
      <div class="card-header bg-light py-2 px-3 d-flex justify-content-between align-items-center">
        <span class="fw-bold text-dark small"><i class="bi bi-map-fill text-primary me-1"></i> Geolocalización</span>
        <button id="btnCentrarMapa" class="btn btn-xs btn-outline-secondary">
          <i class="bi bi-crosshair"></i> Centrar todo
        </button>
      </div>
      <div class="card-body p-0 position-relative">
        <div id="map" style="height: 450px; z-index: 1;"></div>
      </div>
    </div>
  </div>
</div>

<!-- Componente de Formulario/Modal Desacoplado -->
<app-direccion-form id="direccionFormComp"></app-direccion-form>
