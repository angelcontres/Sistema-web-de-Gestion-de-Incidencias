<div class="page-fade-in">
  <!-- Cabecera de Página -->
  <div class="page-header-container">
    <div>
      <h1 class="page-title">Mantenimiento de Ubicaciones</h1>
      <p class="page-subtitle">
        Administra la estructura geográfica y de direcciones físicas del sistema (Países,
        Territorios y Direcciones).
      </p>
    </div>
  </div>

  <!-- Pestañas de Navegación -->
  <ul class="nav nav-tabs mb-4 border-bottom-2" id="ubicacionesTabs">
    <li class="nav-item">
      <button
        class="nav-link active fw-bold text-uppercase small py-3 px-4"
        id="direcciones-tab"
        data-bs-toggle="tab"
        data-bs-target="#direcciones-pane"
        type="button"
        role="tab"
        aria-controls="direcciones-pane"
        aria-selected="true"
      >
        <i class="bi bi-geo-alt-fill me-2"></i> Direcciones
      </button>
    </li>
    <li class="nav-item">
      <button
        class="nav-link fw-bold text-uppercase small py-3 px-4"
        id="territorios-tab"
        data-bs-toggle="tab"
        data-bs-target="#territorios-pane"
        type="button"
        role="tab"
        aria-controls="territorios-pane"
        aria-selected="false"
      >
        <i class="bi bi-diagram-3-fill me-2"></i> Explorador de Territorios
      </button>
    </li>
    <li class="nav-item">
      <button
        class="nav-link fw-bold text-uppercase small py-3 px-4"
        id="paises-tab"
        data-bs-toggle="tab"
        data-bs-target="#paises-pane"
        type="button"
        role="tab"
        aria-controls="paises-pane"
        aria-selected="false"
      >
        <i class="bi bi-globe2 me-2"></i> Países
      </button>
    </li>
  </ul>

  <!-- Contenido de Pestañas -->
  <div class="tab-content" id="ubicacionesTabsContent">
    <!-- PESTAÑA 1: DIRECCIONES -->
    <div
      class="tab-pane fade show active"
      id="direcciones-pane"
      role="tabpanel"
      aria-labelledby="direcciones-tab"
    >
      <app-ubicaciones-direcciones id="direccionesComponent"></app-ubicaciones-direcciones>
    </div>

    <!-- PESTAÑA 2: EXPLORADOR DE TERRITORIOS -->
    <div
      class="tab-pane fade"
      id="territorios-pane"
      role="tabpanel"
      aria-labelledby="territorios-tab"
    >
      <app-ubicaciones-territorios></app-ubicaciones-territorios>
    </div>

    <!-- PESTAÑA 3: PAÍSES -->
    <div class="tab-pane fade" id="paises-pane" role="tabpanel" aria-labelledby="paises-tab">
      <app-ubicaciones-paises></app-ubicaciones-paises>
    </div>
  </div>
</div>
