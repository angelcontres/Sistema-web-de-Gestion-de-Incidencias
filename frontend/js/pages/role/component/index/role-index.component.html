<div class="page-fade-in">
  <!-- Cabecera de Página -->
  <div
    class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4"
  >
    <div>
      <h1 class="h3 fw-bold text-dark mb-1">Roles de Usuario</h1>
      <p class="text-muted small mb-0">
        Gestiona los perfiles de acceso y la jerarquía de roles del sistema.
      </p>
    </div>
    <!-- Botón para abrir el modal en modo creación -->
    <button
      id="btnNuevoRol"
      class="btn btn-primary fw-semibold px-4 py-2 rounded-2 d-flex align-items-center gap-2"
    >
      <i class="bi bi-plus-lg"></i> Nuevo Registro
    </button>
  </div>

  <!-- Tarjeta Principal -->
  <div class="card custom-card border-0 shadow-sm overflow-hidden">
    <div
      class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center"
    >
      <h5 class="card-title fw-bold mb-0 text-dark">Lista de Roles</h5>
      <span
        class="badge bg-primary-soft rounded-pill px-2.5 py-1 text-primary small"
        id="totalRolesBadge"
        >Cargando...</span
      >
    </div>

    <!-- Mensajes de Alerta -->
    <div id="errorAlert" class="alert alert-danger mx-4 my-2 d-none">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span id="errorMessage">Error al cargar roles.</span>
    </div>
    <div id="successAlert" class="alert alert-success mx-4 my-2 d-none">
      <i class="bi bi-check-circle-fill me-2"></i>
      <span id="successMessage">Acción completada con éxito.</span>
    </div>

    <!-- Contenido de la Tabla -->
    <div class="card-body p-0">
      <!-- Spinner de Carga -->
      <div id="loadingSpinner" class="d-flex justify-content-center align-items-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <!-- Estado Vacío -->
      <div id="emptyState" class="text-center py-5 d-none">
        <i class="bi bi-key-slash text-muted display-4"></i>
        <p class="text-muted mt-2">No se encontraron roles registrados.</p>
      </div>

      <!-- Grid de Roles (Tarjetas) -->
      <div class="row g-3 d-none px-4 pb-4" id="rolesGrid">
        <!-- Las tarjetas se inyectarán por JS -->
      </div>

      <!-- Sección de Permisos Estilo Acordeón -->
      <div id="permissionsAccordionContainer" class="d-none bg-light border-top p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="fw-bold text-dark mb-0">
            Permisos del Rol: <span id="activeRoleName" class="text-primary"></span>
          </h6>
          <button class="btn btn-sm btn-outline-secondary" id="btnClosePermissions">Cerrar</button>
        </div>

        <form id="assignPermissionsForm" novalidate>
          <input type="hidden" id="assignRoleId" />

          <div class="accordion shadow-sm" id="accordionMenus">
            <!-- Los items del acordeón (menús y permisos) irán aquí -->
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="submit" class="btn btn-primary fw-semibold px-4" id="btnAssignSubmit">
              <span>Guardar Permisos</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Formulario Modal del Rol -->
<app-role-form id="app-role-form"></app-role-form>
