<!-- Modal de Bootstrap 5 para Crear/Editar Rol -->
<div class="modal fade" id="roleModal" tabindex="-1" aria-labelledby="roleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-white border-0 pt-4 px-4 pb-2">
        <h5 class="modal-title fw-bold text-dark" id="roleModalLabel">Nuevo Rol</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body px-4 pb-4">
        <!-- Alerta de Error interna del modal -->
        <div id="modalErrorAlert" class="alert alert-danger d-none py-2 px-3 small mb-3">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <span id="modalErrorMessage">Hubo un error al guardar el rol.</span>
        </div>

        <form id="roleForm" novalidate>
          <input type="hidden" id="roleId" />

          <!-- Nombre -->
          <div class="mb-3">
            <label for="nombre" class="form-label fw-semibold text-dark">Nombre del Rol</label>
            <input type="text" class="form-control" id="nombre" required placeholder="Ej: Administrador, Soporte" />
            <div class="invalid-feedback">El nombre es obligatorio.</div>
          </div>

          <!-- Descripción -->
          <div class="mb-3">
            <label for="descripcion" class="form-label fw-semibold text-dark">Descripción</label>
            <textarea class="form-control" id="descripcion" rows="3" placeholder="Describe las responsabilidades de este rol..."></textarea>
          </div>

          <!-- Rol Padre -->
          <div class="mb-4">
            <label for="padre_id" class="form-label fw-semibold text-dark">Rol Padre (Jerarquía)</label>
            <select class="form-select" id="padre_id">
              <option value="" selected>Ninguno (Rol Principal)</option>
            </select>
            <div class="form-text text-muted">
              Permite asignar este rol bajo la supervisión de otro.
            </div>
          </div>

          <!-- Botones de Acción -->
          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-light fw-semibold" data-bs-dismiss="modal">
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary fw-semibold px-4" id="btnSubmit">
              <span id="btnText">Guardar Rol</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
