<div class="page-fade-in">
  <!-- Cabecera de Página -->
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
    <div>
      <h1 class="h3 fw-bold text-dark mb-1">Permisos del Sistema</h1>
      <p class="text-muted small mb-0">
        Gestiona los permisos y accesos de las opciones del sistema.
      </p>
    </div>
    <button
      id="btn-nuevo-registro"
      class="btn btn-primary fw-semibold px-4 py-2 rounded-2 d-flex align-items-center gap-2"
    >
      <i class="bi bi-plus-lg"></i> Nuevo Registro
    </button>
  </div>

  <!-- Tarjeta Principal -->
  <div class="card custom-card border-0 shadow-sm overflow-hidden">
    <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
      <span class="badge bg-primary-soft rounded-pill px-2.5 py-1 text-primary small" id="totalPermisosBadge">
        Cargando...
      </span>
    </div>

    <!-- Mensajes de Alerta -->
    <div id="errorAlert" class="alert alert-danger mx-4 my-2 d-none">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span id="errorMessage">Error al cargar permisos.</span>
    </div>

    <div id="successAlert" class="alert alert-success mx-4 my-2 d-none">
      <i class="bi bi-check-circle-fill me-2"></i>
      <span id="successMessage">Acción completada con éxito.</span>
    </div>

    <!-- Tabla Auto-Contenida (Maneja tarjeta, loading, vacío y errores internamente) -->
    <app-data-table
      id="tbl-datos-permisos"
      title="Lista de Permisos"
      empty-text="No se encontraron permisos registrados."
    ></app-data-table>
  </div>

  <!-- Modal component -->
  <app-permission-form id="app-permission-form"></app-permission-form>
</div>
