<link rel="stylesheet" href="js/pages/login/login.component.css" />

<div class="row g-0 page-fade-in w-100" style="min-height: 100vh">
  <!-- Left Side: Traditional Login -->
  <div
    class="col-12 col-lg-5 d-flex align-items-center justify-content-center login-left-panel position-relative bg-white shadow-lg z-2"
  >
    <div class="w-100 px-4 px-sm-5" style="max-width: 480px">
      <!-- Mobile Logo -->
      <div class="text-center mb-4 d-lg-none">
        <div
          class="d-inline-flex align-items-center justify-content-center mb-2"
          style="width: 70px; height: 70px; overflow: hidden"
        >
          <img
            src="assets/logo.svg"
            alt="Logo"
            style="width: 100%; height: 100%; object-fit: contain; transform: scale(1.2)"
          />
        </div>
      </div>

      <div class="text-center mb-5">
        <h2
          class="fw-bolder text-dark mb-2"
          style="letter-spacing: -0.02em; color: var(--primary-color)"
        >
          Bienvenido de nuevo
        </h2>
        <p class="text-muted">Ingresa tus credenciales para acceder a la plataforma</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="premium-form-group mb-4">
          <label for="emailInput" class="premium-label fw-bold text-dark mb-2"
            >Correo Electrónico / Usuario</label
          >
          <div class="input-group input-group-lg shadow-sm rounded-3 overflow-hidden">
            <span
              class="input-group-text border-0 text-muted px-4"
              style="background: var(--color-bg-input, #f8fafc)"
              ><i class="bi bi-person"></i
            ></span>
            <input
              type="text"
              class="form-control border-0 fs-6 py-3"
              id="emailInput"
              placeholder="correo@ejemplo.com o usuario"
              required
              style="background: var(--color-bg-input, #f8fafc)"
            />
          </div>
        </div>

        <div class="premium-form-group mb-5">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label for="passwordInput" class="premium-label fw-bold text-dark mb-0"
              >Contraseña</label
            >
            <a
              href="#"
              class="text-decoration-none small fw-semibold"
              style="color: var(--secondary-color)"
              >¿Olvidaste tu contraseña?</a
            >
          </div>
          <div class="input-group input-group-lg shadow-sm rounded-3 overflow-hidden">
            <span
              class="input-group-text border-0 text-muted px-4"
              style="background: var(--color-bg-input, #f8fafc)"
              ><i class="bi bi-lock"></i
            ></span>
            <input
              type="password"
              class="form-control border-0 fs-6 py-3"
              id="passwordInput"
              placeholder="••••••••"
              required
              style="background: var(--color-bg-input, #f8fafc)"
            />
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="loginSubmitBtn"
          class="btn w-100 py-3 fs-6 fw-bold d-flex align-items-center justify-content-center gap-2 shadow rounded-3 transition-all text-white"
          style="background-color: var(--primary-color); letter-spacing: 0.5px; border: none"
        >
          <span>Ingresar al Sistema</span>
          <output id="loginSpinner" class="spinner-border spinner-border-sm text-white d-none">
            <span class="visually-hidden">Cargando...</span>
          </output>
          <i class="bi bi-arrow-right ms-1"></i>
        </button>

        <!-- Signup Link -->
        <div class="text-center mt-4">
          <p class="text-muted mb-0">
            ¿No tienes cuenta?
            <a
              href="#/signup"
              class="text-decoration-none fw-bold"
              style="color: var(--primary-color)"
              >Regístrate aquí</a
            >
          </p>
        </div>
      </form>

      <!-- Credentials Helper Tip -->
      <div
        class="mt-4 p-3 rounded-3 small text-muted border shadow-sm"
        style="background-color: var(--card-bg, #f4efe3); border-color: rgba(13, 42, 76, 0.05)"
      >
        <p class="mb-2 fw-bold d-flex align-items-center gap-2" style="color: var(--primary-color)">
          <i class="bi bi-info-circle-fill" style="color: var(--secondary-color)"></i> Credenciales
          de Prueba:
        </p>
        <div class="d-flex justify-content-between px-2">
          <span><strong>Usu:</strong> test@example.com</span>
          <span><strong>Pass:</strong> password123</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side: Animated Logo Sequence (Hidden on mobile/tablet) -->
  <div
    class="col-12 col-lg-7 d-none d-lg-flex flex-column align-items-center justify-content-center position-relative overflow-hidden"
    style="background-color: var(--primary-color, #0e3659)"
  >
    <!-- City Skyline Background -->
    <div
      class="position-absolute bottom-0 w-100 pe-none"
      style="height: 35vh; opacity: 0.7; z-index: 0"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 1440 400"
        preserveAspectRatio="none"
        style="width: 100%; height: 100%"
      >
        <!-- Distant buildings (lighter) -->
        <path
          fill="var(--secondary-color)"
          opacity="0.15"
          d="M100,400 l0,-100 l40,0 l0,100 M160,400 l0,-150 l60,0 l0,150 M250,400 l0,-80 l50,0 l0,80 M330,400 l0,-200 l70,0 l0,200 M430,400 l0,-120 l50,0 l0,120 M510,400 l0,-160 l80,0 l0,160 M620,400 l0,-90 l40,0 l0,90 M700,400 l0,-220 l60,0 l0,220 M800,400 l0,-130 l50,0 l0,130 M880,400 l0,-180 l70,0 l0,180 M980,400 l0,-100 l45,0 l0,100 M1050,400 l0,-250 l60,0 l0,250 M1140,400 l0,-140 l50,0 l0,140 M1220,400 l0,-190 l60,0 l0,190 M1300,400 l0,-110 l50,0 l0,110 M1380,400 l0,-170 l60,0 l0,170"
        />
        <!-- Mid buildings -->
        <path
          fill="var(--secondary-color)"
          opacity="0.3"
          d="M0,400 l0,-120 l50,0 l0,120 M70,400 l0,-180 l55,0 l0,180 M150,400 l0,-90 l40,0 l0,90 M210,400 l0,-230 l65,0 l0,230 M300,400 l0,-140 l50,0 l0,140 M380,400 l0,-210 l70,0 l0,210 M480,400 l0,-110 l45,0 l0,110 M550,400 l0,-170 l60,0 l0,170 M640,400 l0,-250 l50,0 l0,250 M720,400 l0,-150 l55,0 l0,150 M810,400 l0,-200 l60,0 l0,200 M900,400 l0,-120 l40,0 l0,120 M970,400 l0,-240 l70,0 l0,240 M1070,400 l0,-160 l50,0 l0,160 M1150,400 l0,-220 l65,0 l0,220 M1240,400 l0,-130 l45,0 l0,130 M1320,400 l0,-180 l55,0 l0,180 M1400,400 l0,-100 l40,0 l0,100"
        />
        <!-- Foreground buildings -->
        <path
          fill="var(--primary-color)"
          filter="brightness(0.8)"
          d="M20,400 l0,-150 l60,0 l0,150 M110,400 l0,-220 l70,0 l0,220 M210,400 l0,-130 l50,0 l0,130 M280,400 l0,-270 l80,0 l0,270 M390,400 l0,-160 l60,0 l0,160 M480,400 l0,-200 l70,0 l0,200 M580,400 l0,-140 l50,0 l0,140 M660,400 l0,-290 l80,0 l0,290 M770,400 l0,-180 l60,0 l0,180 M860,400 l0,-240 l70,0 l0,240 M960,400 l0,-150 l55,0 l0,150 M1040,400 l0,-280 l75,0 l0,280 M1140,400 l0,-170 l60,0 l0,170 M1230,400 l0,-250 l65,0 l0,250 M1320,400 l0,-140 l50,0 l0,140"
        />
        <!-- City grid/lights -->
        <g fill="var(--highlight-color)" opacity="0.6">
          <rect x="40" y="280" width="6" height="6" />
          <rect x="40" y="310" width="6" height="6" />
          <rect x="130" y="210" width="6" height="6" />
          <rect x="150" y="250" width="6" height="6" />
          <rect x="300" y="180" width="6" height="6" />
          <rect x="330" y="220" width="6" height="6" />
          <rect x="680" y="150" width="6" height="6" />
          <rect x="710" y="200" width="6" height="6" />
          <rect x="1060" y="160" width="6" height="6" />
          <rect x="1090" y="220" width="6" height="6" />
        </g>
      </svg>
    </div>

    <!-- Smooth ambient lights matching the palette -->
    <div
      class="position-absolute rounded-circle"
      style="
        width: 50vw;
        height: 50vw;
        background: var(--secondary-color, #4e7d7f);
        opacity: 0.15;
        filter: blur(120px);
        top: -20%;
        right: -10%;
        z-index: 0;
      "
    ></div>
    <div
      class="position-absolute rounded-circle"
      style="
        width: 40vw;
        height: 40vw;
        background: var(--highlight-color, #d98a2f);
        opacity: 0.1;
        filter: blur(120px);
        bottom: -10%;
        left: -10%;
        z-index: 0;
      "
    ></div>

    <!-- Main Content -->
    <div class="z-1 position-relative d-flex flex-column align-items-center">
      <!-- Sequence Container -->
      <app-mascot class="d-block w-100 h-100"></app-mascot>

      <h1 class="text-white fw-bolder mt-3" style="letter-spacing: -0.04em; font-size: 2.7rem">
        AlertCity
      </h1>
      <p
        class="fs-5 mt-2 mb-0"
        style="color: var(--card-bg, #f4efe3); font-weight: 300; opacity: 0.85"
      >
        Gestión inteligente de eventos urbanos.
      </p>
    </div>
  </div>
</div>
