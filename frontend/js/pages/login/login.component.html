<div class="page-fade-in d-flex align-items-center justify-content-center w-100 h-100" style="min-height: 80vh;">
  <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4 position-relative">
    
    <!-- Background subtle glow effect -->
    <div class="position-absolute top-50 start-50 translate-middle rounded-circle bg-primary opacity-25" style="width: 300px; height: 300px; filter: blur(80px); z-index: -1;"></div>

    <div class="premium-card">
      <div class="card-body p-2 p-md-3">
        <!-- Logo / Brand Emblem -->
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 mb-3 shadow-md" style="width: 56px; height: 56px; font-size: 1.75rem; font-weight: 800;">
            <i class="bi bi-shield-check"></i>
          </div>
          <h3 class="fw-bolder text-dark mb-1" style="letter-spacing: -0.02em;">Iniciar Sesión</h3>
          <p class="text-muted small">Ingresa tus credenciales para acceder al sistema</p>
        </div>

        <!-- Error Alert Container -->
        <div id="loginErrorAlert" class="alert alert-danger premium-alert d-none" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span id="loginErrorMessage">Credenciales incorrectas.</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
          <div class="premium-form-group">
            <label for="emailInput" class="premium-label">Correo Electrónico</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control bg-light border-start-0 py-2.5" id="emailInput" placeholder="correo@ejemplo.com" required>
            </div>
          </div>

          <div class="premium-form-group mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="passwordInput" class="premium-label mb-0">Contraseña</label>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control bg-light border-start-0 py-2.5" id="passwordInput" placeholder="••••••••" required>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="loginSubmitBtn" class="btn btn-primary w-100 py-3 fw-bold d-flex align-items-center justify-content-center gap-2 shadow-sm rounded-3">
            <span>Ingresar al Sistema</span>
            <div id="loginSpinner" class="spinner-border spinner-border-sm text-white d-none" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
          </button>
        </form>

        <!-- Credentials Helper Tip (Useful for Testing) -->
        <div class="mt-4 p-3 bg-secondary-soft rounded-3 small text-muted border-0">
          <p class="mb-1 fw-bold text-dark d-flex align-items-center gap-2">
            <i class="bi bi-info-circle-fill text-primary"></i> Credenciales de Prueba:
          </p>
          <ul class="mb-0 ps-3">
            <li>Usuario: <code>test@example.com</code></li>
            <li>Contraseña: <code>password123</code></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
