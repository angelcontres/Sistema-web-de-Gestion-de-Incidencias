<div class="toast align-items-center border-0 mb-2 shadow" role="alert" aria-live="assertive" aria-atomic="true">
  <div class="d-flex">
    <div class="toast-body d-flex align-items-center gap-2 w-100">
      <i class="bi fs-5" id="toast-icon"></i>
      <div class="flex-grow-1">
        <strong id="toast-title"></strong>
        <div class="small lh-sm mt-1" id="toast-message"></div>
      </div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close" id="toast-btn-close"></button>
    </div>
  </div>
</div>
