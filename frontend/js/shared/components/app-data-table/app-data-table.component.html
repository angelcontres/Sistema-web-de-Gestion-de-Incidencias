<!--Hola este es una tabla insana generica que servira para evitar escribir codigo verboso-->
<div class="card custom-card border-0 shadow-sm overflow-hidden">
  <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
    <h5 class="card-title fw-bold mb-0 text-dark" id="title-container">Lista de Registros</h5>
    <span class="badge bg-primary-soft rounded-pill px-2.5 py-1 text-primary small d-none" id="total-badge"></span>
  </div>

  <div class="card-body p-0 position-relative">
    <!-- Alert Message Container -->
    <div id="error-alert" class="alert alert-danger mx-4 my-2 d-none">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span id="error-message"></span>
    </div>

    <!-- Loading State (Skeleton Loaders) -->
    <div id="loading-spinner" class="d-none w-100">
      <table class="table table-borderless mb-0 w-100">
        <tbody>
          <tr>
            <td class="p-4"><div class="skeleton-box w-100" style="height: 40px;"></div></td>
          </tr>
          <tr>
            <td class="px-4 pb-4"><div class="skeleton-box w-100" style="height: 40px;"></div></td>
          </tr>
          <tr>
            <td class="px-4 pb-4"><div class="skeleton-box w-100" style="height: 40px;"></div></td>
          </tr>
          <tr>
            <td class="px-4 pb-4"><div class="skeleton-box w-75" style="height: 40px;"></div></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="text-center py-5 d-none">
      <i class="bi bi-folder-x text-muted display-4"></i>
      <p class="text-muted mt-2" id="empty-message">No se encontraron registros.</p>
    </div>

    <!-- Table Responsive -->
    <div class="table-responsive d-none" id="table-container">
      <table class="table align-middle table-nowrap table-hover mb-0">
        <thead class="table-light">
          <tr class="text-uppercase text-secondary fs-7 fw-semibold border-bottom border-light" id="table-header">
            <!-- Headers will be rendered here dynamically -->
          </tr>
        </thead>
        <tbody id="tbl-data" class="border-top-0">
          <!-- Dynamic rows will be inserted here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Paginación (Card Footer) -->
  <div class="card-footer bg-white border-top py-3 d-flex justify-content-between align-items-center d-none" id="pagination-container">
    <div class="small text-muted" id="pagination-info">
      Mostrando <span class="fw-semibold text-dark" id="page-current">0</span> de <span class="fw-semibold text-dark" id="page-total">0</span> páginas
    </div>
    <div class="btn-group">
      <button class="btn btn-sm btn-outline-secondary" id="btn-prev-page" disabled>
        <i class="bi bi-chevron-left"></i> Anterior
      </button>
      <button class="btn btn-sm btn-outline-secondary" id="btn-next-page" disabled>
        Siguiente <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>
</div>
