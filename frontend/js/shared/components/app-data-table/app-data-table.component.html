<!-- Tabla de datos premium genérica -->
<div class="premium-table-wrapper bg-white">
  <div class="premium-card-header px-4 pt-4 pb-3 mb-0 border-bottom">
    <h5 class="premium-card-title" id="title-container">Lista de Registros</h5>
    <span class="badge bg-primary-soft rounded-pill px-2.5 py-1 text-primary small d-none" id="total-badge"></span>
  </div>

  <div class="card-body p-0 position-relative">
    <!-- Alert Message Container -->
    <div id="error-alert" class="premium-alert alert-danger mx-4 my-3 d-none">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span id="error-message"></span>
    </div>

    <!-- Loading State -->
    <div id="loading-spinner" class="d-flex justify-content-center align-items-center py-5 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="text-center py-5 d-none">
      <i class="bi bi-folder-x text-muted display-4 opacity-50"></i>
      <p class="text-muted mt-3 fw-medium" id="empty-message">No se encontraron registros.</p>
    </div>

    <!-- Table Responsive -->
    <div class="table-responsive d-none" id="table-container">
      <table class="table premium-table table-hover mb-0">
        <thead>
          <tr id="table-header">
            <!-- Headers will be rendered here dynamically -->
          </tr>
        </thead>
        <tbody id="tbl-data" class="border-top-0">
          <!-- Dynamic rows will be inserted here -->
        </tbody>
      </table>
    </div>
  </div>
</div>
