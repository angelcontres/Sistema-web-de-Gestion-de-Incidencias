<div class="card-item p-3 mb-2 bg-white border-start border-4 rounded shadow-sm" style="cursor: pointer; transition: all 0.2s;">
  <div class="d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <!-- EL PUNTO INDICADOR (Por defecto visible, color primario) -->
      <span class="unread-dot bg-primary rounded-circle d-inline-block" style="width: 8px; height: 8px; flex-shrink: 0;"></span>
      <strong class="card-title text-dark small mb-0"></strong>
    </div>
    <small class="card-time text-muted" style="font-size: 0.7rem; white-space: nowrap;"></small>
  </div>
  <p class="card-message mb-0 text-secondary mt-1" style="font-size: 0.8rem;"></p>
</div>
