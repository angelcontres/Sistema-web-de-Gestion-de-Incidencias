<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlertCity</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <!-- Leaflet.js Map Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Leaflet MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
    
    <!-- Custom CSS Design System (Singleton Entrypoint) -->
    <link rel="stylesheet" href="styles/main.css?v=2.3" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body class="d-flex" style="min-height: 100vh; overflow-x: hidden;">
    
    <app-sidebar></app-sidebar>
    <!-- Backdrop overlay for mobile sidebar -->
    <div id="sidebarBackdrop" class="sidebar-backdrop d-none d-lg-none"></div>
    
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
      <app-navbar></app-navbar>
      
      <main id="app" class="flex-grow-1 container-fluid px-4 py-4">
        <div class="d-flex justify-content-center my-5 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
        </div>

        <!-- EJEMPLO DE UI COMPONENTES (Arquitectura Modular) -->
        <div class="ui-card my-4 page-fade-in">
          <h2 class="ui-card-header">Componentes de UI de Ejemplo</h2>
          <p class="text-muted mb-4">Estos componentes consumen la paleta oficial (Azul Marino, Teal y Dorado) a través de variables CSS nativas.</p>
          
          <div class="d-flex gap-3 flex-wrap mb-4">
            <button class="ui-btn ui-btn-primary">
              <i class="bi bi-check-circle"></i> Acción Principal
            </button>
            <button class="ui-btn ui-btn-highlight">
              <i class="bi bi-star"></i> Acción Destacada
            </button>
            <button class="ui-btn ui-btn-outline">
              <i class="bi bi-arrow-right"></i> Secundario
            </button>
          </div>

          <div class="d-flex gap-2">
            <span class="ui-badge ui-badge-teal">Estado: Activo</span>
            <span class="ui-badge ui-badge-gold">Prioridad: Alta</span>
          </div>
        </div>
        <!-- FIN EJEMPLO -->
      </main>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <script type="module" src="js/app.js?v=2.7"></script>
  </body>
</html>
