<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .stroke-main {
        stroke: #0b111a;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .stroke-inner {
        stroke: #0b111a;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Group centered in viewBox -->
  <g transform="translate(0, 0)">

    <!-- 1. BASE INFERIOR AZUL MARINO MATE Y ROBUSTA -->
    <!-- Zócalo / Pie de apoyo -->
    <rect x="116" y="420" width="280" height="28" rx="14" fill="#0b111a" class="stroke-main" />

    <!-- Base trapezoidal principal (Azul Marino Oficial) -->
    <path d="M 126,350 L 386,350 L 402,420 C 402,426 396,430 388,430 L 124,430 C 116,430 110,426 110,420 Z" fill="#1a2332" class="stroke-main" />

    <!-- Detalle / Bisel frontal en la base -->
    <rect x="156" y="380" width="200" height="18" rx="9" fill="#2c3b52" />

    <!-- Anillo de acoplamiento de la baliza (Anillo naranja de seguridad) -->
    <rect x="116" y="326" width="280" height="28" rx="10" fill="#E65100" class="stroke-main" />

    <!-- 2. CÚPULA DE CRISTAL TRANSLÚCIDO (DOME) -->
    <!-- Capa de brillo translúcido de la cúpula (Semiautónoma) -->
    <path d="M 176,64 C 236,44 276,44 336,64 C 386,80 396,130 396,326 L 116,326 C 116,130 126,80 176,64 Z" fill="#FFB300" opacity="0.18" />

    <!-- Trazo principal exterior de la cúpula -->
    <path d="M 176,64 C 236,44 276,44 336,64 C 386,80 396,130 396,326 L 116,326 C 116,130 126,80 176,64 Z" fill="none" class="stroke-main" />

    <!-- Reflejo único de cristal (Limpio y minimalista) -->
    <path d="M 152,94 C 144,150 140,220 138,290" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.8" />

    <!-- 3. MASCOTA ROBÓTICA FUTURISTA (NÚCLEO ENERGÉTICO) -->
    <!-- Silueta base Octagonal / Cristal redondeado (Ámbar) -->
    <polygon points="216,104 296,104 356,164 356,264 296,314 216,314 156,264 156,164" fill="#FF9800" class="stroke-main" />

    <!-- Faceta superior luminosa (Highlight Ámbar) -->
    <polygon points="216,104 296,104 256,140" fill="#FFB300" class="stroke-inner" />

    <!-- Facetas de sombra lateral / inferior (Sombra Naranja Oscuro) -->
    <polygon points="156,264 216,314 256,274 196,224" fill="#E65100" class="stroke-inner" />
    <polygon points="356,264 296,314 256,274 316,224" fill="#E65100" class="stroke-inner" />

    <!-- Páneles teal decorativos (4 esquinas simétricas) (Teal Oficial) -->
    <polygon points="176,134 206,114 216,139 186,159" fill="#1abb9c" class="stroke-inner" />
    <polygon points="336,134 306,114 296,139 326,159" fill="#1abb9c" class="stroke-inner" />
    <polygon points="176,234 206,254 216,229 186,209" fill="#1abb9c" class="stroke-inner" />
    <polygon points="336,234 306,254 296,229 326,209" fill="#1abb9c" class="stroke-inner" />

    <!-- Pantalla Frontal Oscura (Visor Futurista en Azul Marino Profundo) -->
    <rect x="201" y="144" width="110" height="140" rx="22" fill="#0b111a" class="stroke-inner" />

    <!-- Ojos LED y Expresión Amigable (Teal Oficial) -->
    <!-- Ojo Izquierdo -->
    <rect x="223" y="178" width="18" height="36" rx="9" fill="#1abb9c" />
    <!-- Ojo Derecho -->
    <rect x="271" y="178" width="18" height="36" rx="9" fill="#1abb9c" />

    <!-- Sonrisa LED simple y limpia (Teal Oficial) -->
    <path d="M 228,242 Q 256,264 284,242" fill="none" stroke="#1abb9c" stroke-width="6" stroke-linecap="round" />

    <!-- Detalle de micro-LEDs / conectores base de la pantalla -->
    <circle cx="236" cy="272" r="3.5" fill="#FFB300" />
    <circle cx="256" cy="272" r="3.5" fill="#FFB300" />
    <circle cx="276" cy="272" r="3.5" fill="#FFB300" />

  </g>
</svg>
