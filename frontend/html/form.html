<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="../index.html">MiProyecto</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="vista.html">Datos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="form.html">Registro</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-header bg-white py-3">
            <h4 class="mb-0 text-dark fw-bold">Crear Nuevo Registro</h4>
          </div>
          <div class="card-body p-4">
            <form>
              <div class="mb-3">
                <label for="nombreInput" class="form-label fw-semibold">Nombre del Registro</label>
                <input type="text" class="form-control" id="nombreInput" placeholder="Ej. Nuevo Cliente">
              </div>

              <div class="mb-3">
                <label for="descripcionInput" class="form-label fw-semibold">Descripción</label>
                <textarea class="form-control" id="descripcionInput" rows="4"
                  placeholder="Detalles del registro..."></textarea>
              </div>

              <div class="mb-4">
                <label for="estadoSelect" class="form-label fw-semibold">Estado Inicial</label>
                <select class="form-select" id="estadoSelect">
                  <option selected disabled>Seleccione una opción</option>
                  <option value="1">Activo</option>
                  <option value="2">Inactivo</option>
                  <option value="3">Pendiente</option>
                </select>
              </div>

              <div class="d-flex justify-content-end gap-2">
                <a href="vista.html" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary px-4">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
