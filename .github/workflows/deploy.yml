name: Deploy to AWS EC2 (Self-Hosted)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    # AQUÍ PONEMOS LA ETIQUETA: Asegúrate de ponerle 'aws-production' a tu servidor de AWS en GitHub
    runs-on: [self-hosted, aws-production]

    steps:
      - name: Eliminar archivos bloqueados por root (Docker)
        run: |
          # Como Laravel corre como root, los archivos de vendor/ quedan bloqueados y rompen el checkout.
          # Usamos un contenedor temporal para borrarlos con permisos de root.
          if [ -d "backend/api/vendor" ]; then
            docker run --rm -v $(pwd):/workspace busybox rm -rf /workspace/backend/api/vendor
          fi
          if [ -d "backend/api/build" ]; then
            docker run --rm -v $(pwd):/workspace busybox rm -rf /workspace/backend/api/build
          fi

      - name: Bajar el nuevo código directamente al servidor
        uses: actions/checkout@v4

      - name: Configurar archivos .env (Variables de Entorno)
        env:
          ENV_AWS_SECRET: ${{ secrets.ENV_AWS }}
        run: |
          # Configurar Laravel
          echo "$ENV_AWS_SECRET" > backend/api/.env
          # Obligamos a que use la misma clave que Postgres para evitar errores de conexión
          echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> backend/api/.env
          
          # Configurar Docker (Raíz)
          echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" > .env
          echo "PROD_CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.PROD_CLOUDFLARE_TUNNEL_TOKEN }}" >> .env
          echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.PROD_GRAFANA_ADMIN_PASSWORD }}" >> .env
          echo "SONAR_DB_PASSWORD=${{ secrets.PROD_SONAR_DB_PASSWORD }}" >> .env
          
          cp cloudflare/config.aws.yml cloudflare/config.yml

      - name: Construir y reiniciar contenedores
        run: |
          docker compose -f docker-compose.aws.yml pull
          docker compose -f docker-compose.aws.yml up -d --build

      - name: Instalar dependencias y correr Migraciones de Base de Datos
        run: |
          # Tu archivo anterior de AWS no corría migraciones, ¡ahora sí lo hará automáticamente!
          docker exec sistema_laravel_prod composer install --no-ansi --no-interaction --no-progress
          docker exec sistema_laravel_prod php artisan key:generate
          
          until docker exec sistema_postgres_prod pg_isready -U angeltux; do
            echo "Esperando a que la BD responda..."
            sleep 2
          done
          echo "Base de datos viva. Dando 10 segundos extra para que termine de inicializarse..."
          sleep 10
          
          docker exec sistema_laravel_prod php artisan migrate --force

      - name: Limpiar espacio del servidor
        run: docker image prune -f
