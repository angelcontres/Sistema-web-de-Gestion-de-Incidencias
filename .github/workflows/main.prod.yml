on:
  push:
    branches: ["develop"]

jobs:
  despliegue-docker:
    runs-on: [self-hosted, twintail-staging]

    steps:
      # 1. Apagar los contenedores anteriores
      - name: Apagar contenedores anteriores (Limpieza de Volúmenes)
        run: |
          docker compose -f docker-compose.staging.yml down || true

      # 2. Restaurar permisos (No borra nada, pero previene errores de checkout)
      - name: Restaurar permisos de la carpeta usando Docker
        run: docker run --rm -v "$(pwd):/workspace" busybox chown -R $(id -u):$(id -g) /workspace

      # 3. Clonar el nuevo código sin borrar los archivos no trackeados (como storage)
      - name: Copiar el código a la VAIO
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      # 4. Configurar variables de entorno de Laravel (STAGING) usando GitHub Secrets
      - name: Configurar entorno (.env) de Staging
        env:
          ENV_STAGING_SECRET: ${{ secrets.ENV_STAGING }}
        run: |
          echo "$ENV_STAGING_SECRET" > backend/api/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> backend/api/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
          echo "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" >> .env
          echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" >> .env
          echo "SONAR_DB_PASSWORD=${{ secrets.SONAR_DB_PASSWORD }}" >> .env

      # 5. Desplegar la infraestructura de contenedores
      - name: Construir y levantar contenedores en segundo plano
        run: docker compose -f docker-compose.staging.yml up -d --build --pull always

      - name: Instalar dependencias de PHP (Composer) dentro del contenedor
        run: docker exec sistema_laravel_prod composer install --no-ansi --no-interaction --no-progress

      - name: Generar clave de seguridad de Laravel
        run: docker exec sistema_laravel_prod php artisan key:generate

      - name: Limpiar caché y reiniciar colas (Previene correos atascados y carga código nuevo)
        run: |
          docker exec sistema_laravel_prod php artisan optimize:clear
          docker exec sistema_laravel_prod php artisan queue:restart

      - name: Esperar a que la base de datos esté lista
        run: |
          until docker exec sistema_postgres_prod pg_isready -U angeltux; do
            echo "Esperando a postgres..."
            sleep 2
          done
          echo "Postgres aceptó conexiones tempranas. Esperando a que termine su reinicio de instalación (10s)..."
          sleep 10

      - name: Ejecutar migraciones de Laravel dentro del contenedor
        run: docker exec sistema_laravel_prod php artisan migrate --force

      - name: Ejecutar migraciones de OLAP dentro del contenedor
        run: docker exec sistema_laravel_prod php artisan migrate --path=database/migrations/olap --force

      # 6. Pruebas y Cobertura
      - name: Crear base de datos de pruebas temporal
        run: docker exec sistema_postgres_prod psql -U angeltux -c "CREATE DATABASE testing;" || true

      - name: Ejecutar pruebas automatizadas (Backend)
        run: |
          docker exec -e DB_DATABASE=testing sistema_laravel_prod php artisan test --coverage-clover build/logs/clover.xml --log-junit build/logs/junit.xml || true
          docker exec sistema_laravel_prod php artisan optimize:clear

      - name: Normalizar rutas de cobertura para SonarQube
        run: docker exec sistema_laravel_prod php normalize_clover.php || true

      - name: Ejecutar pruebas de Frontend y limpiar node_modules
        run: |
          docker run --rm -v "$(pwd)/frontend:/app" -w /app node:18-alpine sh -c "npm install && npm run test:coverage && rm -rf node_modules" || true

      - name: Limpiar almacenamiento temporal de pruebas (disks)
        run: |
          if [ -d "backend/api/storage/framework/testing/disks" ]; then
            docker run --rm -v "$(pwd):/workspace" busybox rm -rf /workspace/backend/api/storage/framework/testing/disks
          fi

      # 7. SonarQube
      - name: Esperar a que SonarQube inicie por completo
        run: |
          echo "Esperando a que SonarQube levante (puede tomar de 1 a 3 minutos)..."
          until curl -s http://localhost:9009/api/system/status | grep '"status":"UP"'; do
            sleep 10
          done

      - name: Verificar si GitHub está pasando el SONAR_TOKEN
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "::error::El secreto SONAR_TOKEN está vacío en GitHub Actions. No se ha inyectado el token."
            exit 1
          else
            echo "El token SÍ está llegando a GitHub Actions (oculto por seguridad)."
          fi

      - name: Ejecutar Análisis de SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm \
            --network="host" \
            -v "$(pwd):/usr/src" \
            -e SONAR_TOKEN \
            sonarsource/sonar-scanner-cli -X

      # 8. Mantenimiento del servidor
      - name: Limpiar imágenes de Docker huérfanas
        run: docker image prune -f
