version: "3.8"

services:
  # Servidor Web (Nginx) - Despacha Frontend y redirige API
  nginx:
    image: nginx:alpine
    container_name: sistema_nginx_local
    restart: always
    ports:
      - "3005:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
      - postgres
    networks:
      - sistema_incidencias_net_local

  # El Backend (Laravel API)
  laravel:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: sistema_laravel_local
    restart: always
    volumes:
      - ./backend/api:/var/www/html
    networks:
      - sistema_incidencias_net_local

  # Worker de Laravel para procesar tareas en segundo plano (Colas)
  laravel-worker:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: sistema_laravel_worker_local
    restart: always
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - ./backend/api:/var/www/html
    depends_on:
      - postgres
      - laravel
    networks:
      - sistema_incidencias_net_local

  # Servidor de WebSockets (Reverb) - Opcional si usas sockets en local
  laravel-reverb:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: sistema_reverb_local
    restart: always
    command: php artisan reverb:start --host="0.0.0.0" --port=8080
    volumes:
      - ./backend/api:/var/www/html
    depends_on:
      - postgres
      - laravel
    networks:
      - sistema_incidencias_net_local

   # Base de Datos (PostgreSQL + PostGIS)
  postgres:
    image: postgis/postgis:17-3.4-alpine
    container_name: sistema_postgres_local
    restart: always
    environment:
      POSTGRES_DB: gestion_incidencias
      POSTGRES_USER: angeltux
      POSTGRES_PASSWORD: password_local_123
    ports:
      - "5436:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    networks:
      - sistema_incidencias_net_local


networks:
  sistema_incidencias_net_local:
    name: sistema_incidencias_net_local
    driver: bridge

volumes:
  postgres_data_local:
