# Identificador único del proyecto en SonarQube
sonar.projectKey=sistema-incidencias-sqa
sonar.projectName=Sistema Web de Gestión de Incidencias
sonar.projectVersion=1.0

# Directorios de código a analizar
sonar.sources=backend/api/app,frontend/js,frontend/environment

# Ruta de las carpetas de pruebas
sonar.tests=backend/api/tests,frontend/js

# Indicar cuáles archivos de las carpetas de pruebas son realmente tests
sonar.test.inclusions=backend/api/tests/**/*,**/*.test.js

# Exclusiones de archivos/carpetas de terceros para no sesgar las métricas
sonar.exclusions=**/vendor/**,**/node_modules/**,**/storage/**,**/public/**,**/*.test.js,**/tests/**

# URL del servidor local de SonarQube (se puede sobreescribir con flag de CLI en prod: -Dsonar.host.url=https://sonarqube.tudominio.com)
sonar.host.url=http://localhost:9009

# Autenticación para Producción / CI (Token)
# Se recomienda pasar el token por variable de entorno o CLI (ej: -Dsonar.token=$SONAR_TOKEN)
# sonar.token=tu_token_de_produccion_aqui

# Codificación de caracteres
sonar.sourceEncoding=UTF-8

# Calidad de código: Configuración de los perfiles de lenguajes
sonar.php.coverage.reportPaths=backend/api/build/logs/clover.xml
sonar.php.tests.reportPath=backend/api/build/logs/junit.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
